# Render.com Blueprint — 24/7 Cloud Deployment for MK Electricals Operations API v2
services:
  - type: web
    name: mk-electricals-ops-api
    runtime: docker
    rootDir: backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
